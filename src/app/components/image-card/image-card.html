<div
  [ngClass]="{
    'flex flex-col': variant !== 'horizontal',
    'flex flex-row items-center': variant === 'horizontal',
    'max-w-sm': variant !== 'horizontal',
    'max-w-2xl': variant === 'horizontal',
    'bg-white text-slate-800': theme === 'light',
    'bg-slate-800 text-white': theme === 'dark',
    'bg-indigo-600 text-white': theme === 'brand',
    'rounded-2xl shadow-lg overflow-hidden transition-transform duration-300 hover:-translate-y-1 hover:shadow-xl': true
  }"
>
  <div
    class="relative"
    [ngClass]="{
      'w-full': variant !== 'horizontal',
      'w-1/3 shrink-0': variant === 'horizontal',
      'h-48': variant === 'default',
      'h-32': variant === 'compact',
      'h-full': variant === 'horizontal'
    }"
  >
    <img
      [src]="imageUrl"
      [alt]="imageAlt"
      class="w-full h-full object-cover"
    />
    <div *ngIf="badgeText" class="absolute top-3 right-3 bg-white/90 text-slate-800 text-xs font-bold px-2 py-1 rounded-full shadow-sm backdrop-blur-sm">
      {{ badgeText }}
    </div>
  </div>

  <div
    class="flex flex-col"
    [ngClass]="{
      'p-6': variant === 'default' || variant === 'horizontal',
      'p-4': variant === 'compact'
    }"
  >
    <h3
      class="font-bold mb-2"
      [ngClass]="{
        'text-xl': variant !== 'compact',
        'text-lg': variant === 'compact'
      }"
    >
      {{ title }}
    </h3>
    <p
      class="opacity-80"
      [ngClass]="{
        'text-base': variant !== 'compact',
        'text-sm': variant === 'compact'
      }"
    >
      {{ description }}
    </p>
  </div>
</div>
