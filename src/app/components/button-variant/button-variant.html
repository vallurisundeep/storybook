<button type="button" (click)="onClick.emit($event)" [disabled]="disabled"
  class="inline-flex items-center justify-center font-medium transition-colors rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:pointer-events-none"
  [ngClass]="{
    'bg-indigo-600 text-[#ffffff] hover:bg-indigo-700 focus:ring-indigo-500': variant === 'primary',
    'bg-slate-200 text-slate-900 hover:bg-slate-300 focus:ring-slate-500': variant === 'secondary',
    'bg-red-600 text-white hover:bg-red-700 focus:ring-red-500': variant === 'danger',
    'border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 focus:ring-indigo-500': variant === 'outline',
    'bg-transparent text-indigo-600 hover:bg-indigo-100 focus:ring-indigo-500': variant === 'ghost',
    'h-8 px-3 text-sm': size === 'small',
    'h-10 px-4 py-2': size === 'medium',
    'h-12 px-6 text-lg': size === 'large'
  }">
  {{ label }}
</button>
